<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">SpeakLoop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#1E2A5A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>
  <!-- the loop: a 315 degree arc chasing its own arrowhead -->
  <path d="M197.3 88 A80 80 0 1 1 148.7 50.7" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"/>
  <path d="M172.5 57.1 L139.6 69 L150 30.4 Z" fill="#7DD3FC" stroke="#7DD3FC" stroke-width="6" stroke-linejoin="round"/>
  <!-- the voice: a five-bar waveform -->
  <g fill="url(#bar)">
    <rect x="82"  y="115" width="12" height="26" rx="6"/>
    <rect x="102" y="99"  width="12" height="58" rx="6"/>
    <rect x="122" y="85"  width="12" height="86" rx="6"/>
    <rect x="142" y="102" width="12" height="52" rx="6"/>
    <rect x="162" y="113" width="12" height="30" rx="6"/>
  </g>
</svg>
