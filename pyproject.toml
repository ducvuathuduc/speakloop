[project]
name = "speakloop"
version = "0.1.0"
description = "Alexa+ English speaking coach: MCP server (2025-11-25, Streamable HTTP) with MCP Apps and an Agent Skill"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "uvicorn>=0.30", "starlette>=0.40", "pydantic>=2.7", "httpx>=0.27"]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8", "boto3>=1.34"]

[project.scripts]
speakloop = "speakloop.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
